                - DOCUMENT_TOO_SHORT
                - DOCUMENT_TOO_LONG
                - STORAGE_QUOTA_EXCEEDED
                - RATE_LIMITED
                - QUOTA_EXCEEDED
                - ACCOUNT_LOCKED
                - INTERNAL
                - LLM_INVALID_OUTPUT
                - ALL_FINDINGS_DISCARDED
                - LLM_UNAVAILABLE
                - SPEND_LIMIT_REACHED
                - SERVER_BUSY
                - DATABASE_UNAVAILABLE
